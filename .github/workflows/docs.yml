name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install mini.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/core/opt
          git clone --depth 1 https://github.com/echasnovski/mini.nvim.git ~/.local/share/nvim/site/pack/core/opt/mini.nvim

      - name: Generate help
        run: |
          mkdir -p doc
          timeout 300 nvim --headless -u scripts/minidoc.lua || true

      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate"
          file_pattern: doc/*.txt README.md || true
          commit_user_name: "231tr0n"
          commit_user_email: "zeltronsrikar@gmail.com"
