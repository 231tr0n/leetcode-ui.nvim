name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl luajit luarocks unzip
          sudo luarocks install luacheck || true
          curl -fsSL https://github.com/JohnnyMorganz/StyLua/releases/download/v0.20.0/stylua-linux-x86_64.zip -o stylua.zip
          unzip -o stylua.zip -d /usr/local/bin
          chmod +x /usr/local/bin/stylua
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.13.9/lua-language-server-3.13.9-linux-x64.tar.gz -o lls.tar.gz
          mkdir -p /opt/lua-language-server
          tar -xzf lls.tar.gz -C /opt/lua-language-server
          ln -sf /opt/lua-language-server/bin/lua-language-server /usr/local/bin/lua-language-server

      - name: Install mini.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/core/opt
          git clone --depth 1 https://github.com/echasnovski/mini.nvim.git ~/.local/share/nvim/site/pack/core/opt/mini.nvim

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Stylua check
        run: stylua --check lua plugin tests scripts .luacheckrc

      - name: Prettier check
        run: npx --yes prettier --check .

      - name: Luacheck
        run: luacheck . --no-cache

      - name: LuaLS check
        run: lua-language-server --check . --check_out_path /tmp/luals-check.json

      - name: Actionlint
        uses: raven-actions/actionlint@v2

      - name: Run tests
        run: timeout 600 nvim --headless -u scripts/minitest.lua

  docs:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install mini.nvim
        run: |
          mkdir -p ~/.local/share/nvim/site/pack/core/opt
          git clone --depth 1 https://github.com/echasnovski/mini.nvim.git ~/.local/share/nvim/site/pack/core/opt/mini.nvim

      - name: Generate help
        run: |
          mkdir -p doc
          timeout 300 nvim --headless -u scripts/minidoc.lua

      - name: Commit docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate"
          file_pattern: doc/*.txt
          commit_user_name: "231tr0n"
          commit_user_email: "zeltronsrikar@gmail.com"
